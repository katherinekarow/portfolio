name: Record high score
# Triggered by the score relay (tools/score-relay) with a repository_dispatch event.
on:
  repository_dispatch:
    types: [score]
permissions:
  contents: write
concurrency:
  group: scores          # one score at a time, so commits never collide
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: add
        env:
          SCORE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python tools/scores.py add
      - if: steps.add.outputs.message != ''
        env:
          MSG: ${{ steps.add.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scores/scores.json
          git commit -m "$MSG"
          git pull --rebase
          git push
