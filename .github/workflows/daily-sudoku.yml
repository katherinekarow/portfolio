name: Daily Sudoku

on:
  schedule:
    - cron: "17 10 * * *"   # every day ~6 AM US Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  puzzle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate today's puzzle
        run: python tools/daily_sudoku.py
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sudoku/daily.json fun/sudoku/daily.svg
          git diff --cached --quiet || git commit -m "🧩 Daily Sudoku $(date -u +%F)"
          git push
