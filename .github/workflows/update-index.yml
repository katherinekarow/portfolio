name: Update project index

on:
  push:
    branches: [main]
    paths:
      - "**/README.md"
      - "tools/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild front-page tables and website gallery
        run: python tools/build_index.py
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/projects.json
          git diff --cached --quiet || git commit -m "📚 Update project index"
          git push
